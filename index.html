<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Rhythm</title>
<style>
  body { background: #0b111e; color: #fff; font-family: sans-serif; text-align: center; }
  #field { width: 240px; height: 350px; background: #161f30; margin: 10px auto; position: relative; border: 2px solid #0052FF; overflow: hidden; }
  .line { position: absolute; top: 300px; width: 100%; height: 4px; background: #00D395; }
  .note { position: absolute; width: 60px; height: 20px; background: #0052FF; border-radius: 4px; }
</style>
</head>
<body>
<h1>Base Sequencer Hero</h1>
<p>Жми клавиши [1], [2], [3] когда блоки касаются зелёной линии!</p>
<h2>Очки: <span id="score">0</span></h2>
<div id="field"><div class="line"></div></div>
<script>
  let score = 0, notes = [];
  const field = document.getElementById('field');
  function spawnNote() {
    let col = Math.floor(Math.random() * 3);
    let n = document.createElement('div');
    n.className = 'note'; n.style.left = (col * 80 + 10) + 'px'; n.style.top = '0px';
    field.appendChild(n);
    notes.push({ el: n, y: 0, col: col });
  }
  setInterval(spawnNote, 1000);
  setInterval(() => {
    notes.forEach((n, i) => {
      n.y += 4; n.el.style.top = n.y + 'px';
      if(n.y > 350) { n.el.remove(); notes.splice(i, 1); }
    });
  }, 20);
  window.onkeydown = (e) => {
    let k = e.key;
    if(k === '1' || k === '2' || k === '3') {
      let c = parseInt(k) - 1;
      let hit = notes.find(n => n.col === c && n.y >= 270 && n.y <= 330);
      if(hit) {
        score += 10; document.getElementById('score').innerText = score;
        hit.el.remove(); notes = notes.filter(n => n !== hit);
      }
    }
  };
</script>
</body>
</html>
